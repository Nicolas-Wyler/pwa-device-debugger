<!doctype html><html><head><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Preview verification fixture</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;font:16px Helvetica;background:#16211b;color:#d6eccd}main{width:100%;height:100%;padding:50px 16px 34px}button{font:inherit}#drag{height:150px;overflow:auto;background:#273d30}#drag div{width:1600px;height:100%;background:repeating-linear-gradient(90deg,#47704f 0 100px,#213e2a 100px 200px)}</style></head><body><main><h1>Generic PWA fixture</h1><p>Fixed viewport; resize the outer window.</p><button id="tap">Touch test</button><output id="result">No input</output><label>Text focus <input id="text" type="text"></label><div id="drag"><div></div></div><script>tap.onpointerdown=e=>result.textContent=e.pointerType+' '+innerWidth+'×'+innerHeight;document.body.dataset.viewport=innerWidth+'x'+innerHeight;</script></main></body></html>
